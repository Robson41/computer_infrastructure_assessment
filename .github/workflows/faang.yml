# =========================================
# GitHub Actions Workflow: FAANG Stock Data
# =========================================
# This workflow fetches FAANG stock data and creates plots automatically.
# It is designed to run weekly (every Saturday morning) and can also be
# triggered manually if needed.

name: FAANG Data Automation  # Name of the workflow

# Triggers for the workflow
on:
  schedule:
    # Runs at 08:00 UTC every Saturday
    - cron: '0 8 * * SAT'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

# Define the jobs to run in this workflow
jobs:
  fetch_and_plot:
    name: Fetch FAANG Data & Generate Plots  # Friendly job name
    runs-on: ubuntu-latest  # Use latest Ubuntu environment for the job

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3
        # This step ensures that the workflow has access to your repository files

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'  # Specify Python version compatible with your project

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        # This ensures all required Python packages (pandas, matplotlib, yfinance, seaborn, etc.) are installed

      # Step 4: Run the FAANG data script
      - name: Run FAANG Script
        run: |
          python faang.py
        # This executes your faang.py script which:
        # 1) Fetches stock data for FAANG companies
        # 2) Saves CSVs in data/
        # 3) Generates plots in plots/

      # Step 5: Optional – list the generated plots
      - name: List Generated Plots
        run: ls -lh plots/
        # This provides a quick summary of the plots created, including file sizes

